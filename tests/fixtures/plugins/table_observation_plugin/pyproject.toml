[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scidiscovery-table-observation"
version = "0.1.0"
description = "Blind non-curve table observation plugin for SciDiscovery"
requires-python = ">=3.10"
dependencies = ["scidiscovery>=0.1.0"]

[project.entry-points."scidiscovery.plugins"]
table_observation = "table_observation.plugin:PLUGIN"

[tool.setuptools.packages.find]
where = ["."]
include = ["table_observation*"]
