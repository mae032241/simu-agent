[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scidiscovery-invalid-unicode-operation-test-plugin"
version = "0.0.1"
requires-python = ">=3.10"

[project.entry-points."scidiscovery.plugins"]
invalid_unicode = "invalid_unicode_operation_plugin.plugin:PLUGIN"

[tool.setuptools.packages.find]
where = ["."]
