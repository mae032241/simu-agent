[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scidiscovery-blind-csv-test-plugin"
version = "0.1.0"
description = "Blind CSV Operation plugin used to measure extension cost"
requires-python = ">=3.10"
dependencies = ["scidiscovery>=0.1.0"]

[project.entry-points."scidiscovery.plugins"]
blind_csv = "blind_csv_plugin.plugin:PLUGIN"

[tool.setuptools.packages.find]
where = ["."]
include = ["blind_csv_plugin*"]
