[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scidiscovery-architecture-operation-test-plugin"
version = "0.0.1"
requires-python = ">=3.10"

[project.entry-points."scidiscovery.plugins"]
architecture_fixture = "architecture_operation_test_plugin.plugin:ARCHITECTURE_TEST_PLUGIN"

[tool.setuptools.packages.find]
where = ["."]
