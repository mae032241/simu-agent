[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scidiscovery-m7-effect-test-plugin"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = ["scidiscovery>=0.1.0"]

[project.entry-points."scidiscovery.plugins"]
m7_effect_fixture = "m7_effect_operation_plugin:PLUGIN"

[tool.setuptools.packages.find]
where = ["."]
include = ["m7_effect_operation_plugin*"]
