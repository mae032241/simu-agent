[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scidiscovery-curve-score"
version = "0.2.1"
description = "Compiled deterministic curve operations for SciDiscovery"
requires-python = ">=3.10"
dependencies = ["scidiscovery>=0.1.0"]

[project.entry-points."scidiscovery.plugins"]
curve_score = "curve_score.plugin:PLUGIN"

[tool.setuptools.packages.find]
where = ["."]
include = ["curve_score*"]
