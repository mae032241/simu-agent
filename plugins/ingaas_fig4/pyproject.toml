[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scidiscovery-ingaas-fig4"
version = "0.2.0"
description = "Optional compiled Operation for frozen InGaAs Fig.4 scoring"
requires-python = ">=3.10"
dependencies = ["scidiscovery>=0.1.0", "tcad-artifact>=0.1.0", "scidiscovery-curve-figure-evidence>=0.1.0"]

[project.entry-points."scidiscovery.plugins"]
ingaas_fig4 = "ingaas_fig4.plugin:PLUGIN"

[tool.setuptools.packages.find]
where = ["."]
include = ["ingaas_fig4*"]

[tool.setuptools.package-data]
ingaas_fig4 = ["figure_geometry.json"]
