[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scidiscovery-curve-figure-evidence"
version = "0.1.0"
description = "Optional paper-figure evidence Operations for SciDiscovery"
requires-python = ">=3.10"
dependencies = [
  "scidiscovery>=0.1.0",
  "scidiscovery-curve-score>=0.2.1",
]

[project.entry-points."scidiscovery.plugins"]
curve_figure_evidence = "curve_figure_evidence.plugin:PLUGIN"

[project.entry-points."scidiscovery.instance_views"]
curve_figure_evidence = "curve_figure_evidence.instance_views:build_presentation"

[tool.setuptools.packages.find]
where = ["."]
include = ["curve_figure_evidence*"]
