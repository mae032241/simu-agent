name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils bubblewrap
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install -e plugins/tcad_artifact
          python -m pip install -e plugins/curve_score
          python -m pip install -e plugins/curve_figure_evidence
      - name: Source tests
        run: python scripts/run_tests.py --config scripts/test_resources_ci.json --lane source --per-file --output /tmp/scid-source-ci
      - name: Installed boundary tests
        run: python scripts/run_tests.py --config scripts/test_resources_ci.json --lane installed --output /tmp/scid-installed-ci
      - name: Process lifecycle tests
        run: python scripts/run_tests.py --config scripts/test_resources_ci.json --lane process --per-file --output /tmp/scid-process-ci
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.python-version }}
          path: /tmp/scid-*-ci
