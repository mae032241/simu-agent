name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils bubblewrap
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install -e plugins/tcad_artifact
          python -m pip install -e plugins/ingaas_fig4
      - name: Test
        run: pytest -q
